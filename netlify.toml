[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The pillar page used to exist at two addresses; the Hebrew one is the real one.
[[redirects]]
  from = "/shivuk-klinika-lamtapelim"
  to = "/%D7%A9%D7%99%D7%95%D7%95%D7%A7-%D7%A7%D7%9C%D7%99%D7%A0%D7%99%D7%A7%D7%94-%D7%9C%D7%9E%D7%98%D7%A4%D7%9C%D7%99%D7%9D"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
