[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# (The redirect of /shivuk-klinika-lamtapelim lives in public/_redirects, which Netlify reads first.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
